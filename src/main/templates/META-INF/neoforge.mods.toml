modLoader="javafml"
loaderVersion="[11,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description="Automates villager and piglin trading, breeding, conversion and resource production."
logoFile="logofile.png"
authors="Isaac"

[[mixins]]
config="trading_cells.rei_compat.mixins.json"
requiredMods=["architectury", "roughlyenoughitems"]

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="roughlyenoughitems"
type="optional"
versionRange="${rei_version_range}"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"
