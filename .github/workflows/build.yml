name: Build

on:
  push:
    branches:
      - main
      - 'mc-*'

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Comprobación principal del proyecto.
  # Ubuntu actúa como plataforma de CI principal.
  verify:
    name: Verify project
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install validator dependencies
        run: python -m pip install --requirement tools/requirements.txt

      - name: Build and verify project
        run: ./gradlew clean build


  # Solo comprobamos en Windows las reglas específicamente
  # relacionadas con portabilidad.
  #
  # No tiene sentido volver a ejecutar toda la suite aquí,
  # ya que Java/NeoForge ya se verifica en Ubuntu.
  portability-windows:
    name: Windows portability
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'

      - name: Check portability
        run: .\gradlew.bat checkPortability


  # Los GameTests arrancan Minecraft y son considerablemente más caros.
  # Se ejecutan al integrar cambios en una rama mantenida,
  # no en cada modificación de un Pull Request.
  gametests:
    name: Minecraft GameTests
    if: github.event_name == 'push'
    needs:
      - verify

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run GameTest server
        run: ./gradlew runGameTestServer


  # Validación completa previa a una publicación.
  #
  # Se lanza manualmente desde:
  # GitHub -> Actions -> Build -> Run workflow
  release:
    name: Release verification
    if: github.event_name == 'workflow_dispatch'
    needs:
      - verify
      - portability-windows

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install validator dependencies
        run: python -m pip install --requirement tools/requirements.txt

      - name: Run complete release verification
        run: ./gradlew clean releaseCheck