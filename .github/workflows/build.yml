name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install visual validator dependencies
        run: python -m pip install --requirement tools/requirements.txt

      - name: Verify project
        run: ./gradlew clean build releaseCheck

  portability:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install visual validator dependencies
        run: python -m pip install --requirement tools/requirements.txt

      - name: Verify project on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat clean check

      - name: Verify project on Unix
        if: runner.os != 'Windows'
        run: ./gradlew clean check
