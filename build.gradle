plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
        content {
            includeGroup 'net.fabricmc'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Optional mods used only by selected development runs.
configurations {
    localRuntime
}

sourceSets {
    developmentClient {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    performanceClient {
        java.srcDir('tools/performance/client/java')
        resources.srcDir('tools/performance/client/resources')
        compileClasspath += sourceSets.main.output
    }
    gameTest {
        java.setSrcDirs(['src/gameTest/java'])
        resources.setSrcDirs(['src/gameTest/resources'])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations.developmentClientCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.developmentClientRuntimeClasspath.extendsFrom(
        configurations.runtimeClasspath,
        configurations.localRuntime
)
configurations.performanceClientCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.performanceClientRuntimeClasspath.extendsFrom(
        configurations.runtimeClasspath,
        configurations.localRuntime
)
configurations.gameTestCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.gameTestRuntimeClasspath.extendsFrom(configurations.runtimeClasspath)

def prepareVulkanFmlConfig = tasks.register('prepareVulkanFmlConfig') {
    group = 'ide'
    description = 'Disables the NeoForge early OpenGL window for Vulkan development runs.'
    outputs.upToDateWhen { false }

    doLast {
        def configFile = layout.projectDirectory.file('run/vulkan/config/fml.toml').asFile
        configFile.parentFile.mkdirs()
        def setting = 'earlyWindowControl = false'
        def current = configFile.exists() ? configFile.getText('UTF-8') : ''
        def settingPattern = ~/(?m)^earlyWindowControl\s*=\s*(?:true|false)\s*$/
        def updated
        if (settingPattern.matcher(current).find()) {
            updated = current.replaceFirst(settingPattern, setting)
        } else if (current.isEmpty()) {
            updated = setting + System.lineSeparator()
        } else {
            def separator = current.endsWith('\n') ? '' : System.lineSeparator()
            updated = current + separator + setting + System.lineSeparator()
        }
        if (updated != current) {
            configFile.setText(updated, 'UTF-8')
        }
    }
}

def preparePerformanceVulkanFmlConfig = tasks.register('preparePerformanceVulkanFmlConfig') {
    group = 'verification'
    description = 'Disables the NeoForge early OpenGL window for Vulkan performance runs.'
    outputs.upToDateWhen { false }

    doLast {
        def runDirectory = project.file(
                project.findProperty('performanceClientRunDirectory')
                        ?: 'build/performance/client/vulkan'
        )
        def configFile = new File(runDirectory, 'config/fml.toml')
        configFile.parentFile.mkdirs()
        def setting = 'earlyWindowControl = false'
        def current = configFile.exists() ? configFile.getText('UTF-8') : ''
        def settingPattern = ~/(?m)^earlyWindowControl\s*=\s*(?:true|false)\s*$/
        def updated
        if (settingPattern.matcher(current).find()) {
            updated = current.replaceFirst(settingPattern, setting)
        } else if (current.isEmpty()) {
            updated = setting + System.lineSeparator()
        } else {
            def separator = current.endsWith('\n') ? '' : System.lineSeparator()
            updated = current + separator + setting + System.lineSeparator()
        }
        if (updated != current) {
            configFile.setText(updated, 'UTF-8')
        }
    }
}

def configurePerformanceClientRun = { run, currentProject ->
    if (currentProject.hasProperty('performanceClientOutput')) {
        run.systemProperty(
                'trading_cells.performance.client.output',
                currentProject.property('performanceClientOutput').toString()
        )
    }
    run.systemProperty(
            'trading_cells.performance.client.warmupSeconds',
            currentProject.findProperty('performanceClientWarmup')?.toString() ?: '15'
    )
    run.systemProperty(
            'trading_cells.performance.client.measureSeconds',
            currentProject.findProperty('performanceClientMeasure')?.toString() ?: '30'
    )
    run.systemProperty(
            'trading_cells.performance.client.scenario',
            currentProject.findProperty('performanceClientScenario')?.toString() ?: 'unspecified'
    )
    run.systemProperty(
            'trading_cells.performance.client.width',
            currentProject.findProperty('performanceClientWidth')?.toString() ?: '1920'
    )
    run.systemProperty(
            'trading_cells.performance.client.height',
            currentProject.findProperty('performanceClientHeight')?.toString() ?: '1080'
    )
    run.systemProperty(
            'trading_cells.performance.client.requireWorld',
            currentProject.hasProperty('quickPlayWorld').toString()
    )
    if (currentProject.hasProperty('performanceClientCamera')) {
        run.systemProperty(
                'trading_cells.performance.client.camera',
                currentProject.property('performanceClientCamera').toString()
        )
    }
    if (currentProject.hasProperty('performanceClientOpenBlock')) {
        run.systemProperty(
                'trading_cells.performance.client.openBlock',
                currentProject.property('performanceClientOpenBlock').toString()
        )
    }
    if (currentProject.hasProperty('performanceClientUiFixture')) {
        run.systemProperty('trading_cells.performance.client.uiFixture',
                currentProject.property('performanceClientUiFixture').toString())
    }
    run.programArguments.addAll(
            '--width',
            currentProject.findProperty('performanceClientWidth')?.toString() ?: '1920',
            '--height',
            currentProject.findProperty('performanceClientHeight')?.toString() ?: '1080'
    )
    if (currentProject.hasProperty('quickPlayWorld')) {
        run.programArguments.addAll(
                '--quickPlaySingleplayer',
                currentProject.property('quickPlayWorld').toString()
        )
    }
    if (currentProject.hasProperty('performanceClientJfr')) {
        run.systemProperty(
                'trading_cells.performance.client.jfr',
                currentProject.property('performanceClientJfr').toString()
        )
    }
}

neoForge {
    enable {
        version = project.neo_version
        // Recipe registry tests require Minecraft sources, including on CI.
        disableRecompilation = false
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "trading_cells_gametest" {
            sourceSet(sourceSets.gameTest)
        }
        "trading_cells_performance" {
            sourceSet(sourceSets.performanceClient)
        }
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        configureEach {
            loadedMods = [mods.trading_cells]
        }

        client {
            client()
            sourceSet = sourceSets.developmentClient
            // The dedicated client source set includes optional client mods
            // without exposing their classes to dedicated-server runs.
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // REI 26.2 still uses @OnlyIn. NeoForge reports every usage in the
            // development log, but this avoids an upstream warning blocking runClient.
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll(
                        '--quickPlaySingleplayer',
                        project.property('quickPlayWorld').toString()
                )
            }
        }

        clientVulkan {
            client()
            sourceSet = sourceSets.developmentClient
            gameDirectory = project.file('run/vulkan')
            // NeoForge 26.2.0.57 still creates its early window with an
            // OpenGL context, which cannot be handed to Minecraft's Vulkan backend.
            taskBefore prepareVulkanFmlConfig.get()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            programArguments.addAll '--graphicsBackend', 'VULKAN'
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll(
                        '--quickPlaySingleplayer',
                        project.property('quickPlayWorld').toString()
                )
            }
        }

        clientOpenGL {
            client()
            sourceSet = sourceSets.developmentClient
            gameDirectory = project.file('run/opengl')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            programArguments.addAll '--graphicsBackend', 'OPENGL'
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll(
                        '--quickPlaySingleplayer',
                        project.property('quickPlayWorld').toString()
                )
            }
        }

        performanceClientVulkan {
            client()
            sourceSet = sourceSets.performanceClient
            loadedMods = project.hasProperty('performanceExcludeTradingCells')
                    ? [mods.trading_cells_performance]
                    : [mods.trading_cells, mods.trading_cells_performance]
            gameDirectory = project.file(
                    project.findProperty('performanceClientRunDirectory')
                            ?: 'build/performance/client/vulkan'
            )
            taskBefore preparePerformanceVulkanFmlConfig.get()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            programArguments.addAll '--graphicsBackend', 'VULKAN'
            configurePerformanceClientRun(delegate, project)
        }

        performanceClientOpenGL {
            client()
            sourceSet = sourceSets.performanceClient
            loadedMods = project.hasProperty('performanceExcludeTradingCells')
                    ? [mods.trading_cells_performance]
                    : [mods.trading_cells, mods.trading_cells_performance]
            gameDirectory = project.file(
                    project.findProperty('performanceClientRunDirectory')
                            ?: 'build/performance/client/opengl'
            )
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            programArguments.addAll '--graphicsBackend', 'OPENGL'
            configurePerformanceClientRun(delegate, project)
        }

        server {
            server()
            // Keep dedicated-server runs isolated from client-only jars placed
            // in run/mods (notably REI and its client-side dependencies).
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        performanceServer {
            server()
            gameDirectory = project.file(
                    project.findProperty('performanceRunDirectory') ?: 'build/performance/server'
            )
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('performanceJfr')) {
                jvmArgument "-XX:StartFlightRecording=filename=${project.property('performanceJfr')},settings=profile,dumponexit=true"
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.trading_cells, mods.trading_cells_gametest]
            gameDirectory = project.file('build/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // cosmocraft of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = name == 'gameTestServer'
                    ? org.slf4j.event.Level.INFO
                    : org.slf4j.event.Level.DEBUG
        }
    }

}

