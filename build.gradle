tasks.register('testLogisticsResourceValidation', Exec) {
    group = 'verification'
    description = 'Tests portable PNG comparison and detection of changed logistics resources.'
    commandLine pythonExecutable, '-m', 'unittest', 'discover', '-s', 'tools', '-p', 'test_logistics_resources.py'
    inputs.files('tools/test_logistics_resources.py', 'tools/generate_logistics_resources.py', 'tools/generate_family_upgrades.py')
