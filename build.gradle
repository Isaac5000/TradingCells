tasks.register('recordReleaseEvidence', Exec) {
    group = 'verification'
    description = 'Runs releaseCheck and records a non-destructive worktree and JAR audit.'
    dependsOn tasks.named('releaseCheck')
    commandLine pythonExecutable,
            'tools/release/record_release_evidence.py',
            '--output',
            'build/reports/release/release-audit.json',
            '--release-check-passed'
    inputs.file('tools/release/record_release_evidence.py')
    inputs.file('build/libs/' + project.mod_id + '-' + project.mod_version + '.jar')
    outputs.files(
            'build/reports/release/release-audit.json',
            'build/reports/release/release-audit.md'
    )
    outputs.upToDateWhen { false }
}

