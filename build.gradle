    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            rei_version_range      : rei_version_range,
            jade_version_range     : jade_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.add('-Xlint:unchecked')
    options.compilerArgs.add('-Xlint:deprecation')
}

tasks.register('checkArchitecture') {
    group = 'verification'
    description = 'Checks hexagonal dependency boundaries and production registry safety.'
    def sourceRoot = file('src/main/java')
    inputs.files(fileTree(sourceRoot) {
        include '**/*.java'
    })

    doLast {
        def violations = []
        def featurePrefix = 'com.cosmocraft.trading_cells.feature.'
        def sharedPrefix = 'com.cosmocraft.trading_cells.shared.'
        def sharedFeatures = ['captures', 'combat'] as Set
        fileTree(sourceRoot).matching { include '**/*.java' }.each { source ->
            def relativePath = sourceRoot.toPath()
                    .relativize(source.toPath())
                    .toString()
                    .replace('\\', '/')
            def lines = source.readLines('UTF-8')
            def imports = []
            lines.eachWithIndex { line, index ->
                if (line.startsWith('import ')) {
                    imports << [text: line, line: index + 1]
                }
            }
            def expectedPackage = relativePath
                    .substring(0, relativePath.lastIndexOf('/'))
                    .replace('/', '.')
            def declaredPackage = lines.find { it.startsWith('package ') }
            if (declaredPackage != "package ${expectedPackage};") {
                violations << "${relativePath}: package does not match its directory"
            }
            def featureMatch = relativePath =~ /^com\/cosmocraft\/trading_cells\/feature\/([^\/]+)\//
            def ownerFeature = featureMatch.find() ? featureMatch.group(1) : null
            def sharedMatch = relativePath =~ /^com\/cosmocraft\/trading_cells\/shared\/([^\/]+)\//
            def ownerSharedModule = sharedMatch.find() ? sharedMatch.group(1) : null

            if (relativePath.contains('/domain/')) {
                def forbidden = [
                        'net.minecraft.',
                        'net.neoforged.',
                        'com.cosmocraft.trading_cells.platform.',
                        '.adapters.',
                        '.application.'
                ]
                imports.each { imported ->
                    if (forbidden.any { imported.text.contains(it) }) {
                        violations << "${relativePath}:${imported.line}: domain imports ${imported.text}"
                    }
                }
            }

            if (relativePath.contains('/application/')) {
                def forbidden = [
                        'net.minecraft.',
                        'net.neoforged.',
                        'com.cosmocraft.trading_cells.platform.',
                        '.adapters.'
                ]
                imports.each { imported ->
                    if (forbidden.any { imported.text.contains(it) }) {
                        violations << "${relativePath}:${imported.line}: application imports ${imported.text}"
                    }
                }
            }

            def sourceText = lines.join('\n')
            if (relativePath.contains('/adapters/')
                    && sourceText.contains('.application.service.')) {
                violations << "${relativePath}: adapter imports a concrete application service"
            }
            if (relativePath.contains('/adapters/')
                    && sourceText.contains('FeatureSettingsProvider')) {
                violations << "${relativePath}: adapter accesses configuration instead of an input port"
            }
            if (relativePath.contains('/application/service/')
                    && !(sourceText =~ /implements\s+\w+UseCase/).find()) {
                violations << "${relativePath}: application service does not implement an input port"
            }
            if (sourceText =~ /new\s+\w+Service\s*\(/) {
                if (relativePath != 'com/cosmocraft/trading_cells/platform/neoforge/bootstrap/FeatureComposition.java') {
                    violations << "${relativePath}: concrete services may only be created in FeatureComposition"
                }
            }

            if (ownerFeature != null) {
                imports.each { imported ->
                    if (imported.text.startsWith("import ${sharedPrefix}")
                            && !imported.text.contains('.shared.machines.domain.')
                            && !imported.text.contains('.shared.mobfarm.domain.')) {
                        violations << "${relativePath}:${imported.line}: use a public shared-domain boundary"
                        return
                    }
                    if (!imported.text.startsWith("import ${featurePrefix}")) {
                        return
                    }
                    def target = imported.text
                            .substring(("import ${featurePrefix}").length())
                            .takeWhile { it != '.' }
                    if (target == ownerFeature) {
                        return
                    }
                    if (!sharedFeatures.contains(target)) {
                        violations << "${relativePath}:${imported.line}: feature ${ownerFeature} depends on ${target}"
                        return
                    }
                    if (target == 'captures'
                            && !imported.text.contains('.captures.domain.')
                            && !imported.text.contains('.captures.adapters.api.')) {
                        violations << "${relativePath}:${imported.line}: use the public Captures API"
                    }
                    if (target == 'combat'
                            && !imported.text.contains('.combat.domain.')
                            && !imported.text.contains('.combat.adapters.api.')) {
                        violations << "${relativePath}:${imported.line}: use the public Combat API"
                    }
                }
            }
            if (ownerSharedModule != null) {
                imports.each { imported ->
                    if (imported.text.startsWith("import ${featurePrefix}")) {
                        violations << "${relativePath}:${imported.line}: shared kernel depends on a feature"
                    }
                }
            }

            [
                    'RegisterGameTestsEvent',
                    'GameTestInstance',
                    'net.minecraft.gametest'
            ].each { forbiddenGameTestApi ->
                if (sourceText.contains(forbiddenGameTestApi)) {
                    violations << "${relativePath}: production source contains ${forbiddenGameTestApi}"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Architecture violations:\n - " + violations.join('\n - ')
            )
        }
    }
}

tasks.register('checkGraphicsBackendIndependence') {
    group = 'verification'
    description = 'Rejects direct dependencies on OpenGL or Vulkan implementation classes.'
    def sourceRoot = file('src/main/java')
    def forbiddenReferences = [
            'org.lwjgl.opengl',
            'org.lwjgl.vulkan',
            'com.mojang.blaze3d.opengl',
            'com.mojang.blaze3d.vulkan',
            'GlStateManager',
            'GlDevice',
            'VulkanDevice'
    ]
    inputs.files(fileTree(sourceRoot) {
        include '**/*.java'
    })

    doLast {
        def violations = []
        fileTree(sourceRoot).matching { include '**/*.java' }.each { source ->
            def relativePath = sourceRoot.toPath()
                    .relativize(source.toPath())
                    .toString()
                    .replace('\\', '/')
            source.readLines('UTF-8').eachWithIndex { line, index ->
                forbiddenReferences.each { forbiddenReference ->
                    if (line.contains(forbiddenReference)) {
                        violations << "${relativePath}:${index + 1}: references ${forbiddenReference}"
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Graphics backend independence violations:\n - " + violations.join('\n - ')
            )
        }
    }
}

tasks.register('verifyDomainRules', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free checks for the pure feature rules.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cosmocraft.trading_cells.architecture.DomainRulesVerification'
}

tasks.named('test', Test).configure {
    failOnNoDiscoveredTests = false
}

def pythonExecutable = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        ? 'python'
        : 'python3'

