def publishedJar = tasks.named('jar', Jar)
tasks.register('checkPublishedJarContents') {
    group = 'verification'
    description = 'Checks that the release JAR contains required resources and no development leftovers.'
    dependsOn publishedJar
    inputs.file(publishedJar.flatMap { it.archiveFile })

    doLast {
        def jarFile = publishedJar.get().archiveFile.get().asFile
        def entries = []
        new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            def enumeration = zip.entries()
            while (enumeration.hasMoreElements()) {
                def entry = enumeration.nextElement()
                if (!entry.directory) {
                    entries << entry.name
                }
            }
        }

        def required = [
                'META-INF/neoforge.mods.toml',
                'com/cosmocraft/trading_cells/platform/neoforge/bootstrap/TradingCells.class',
                'assets/trading_cells/lang/en_us.json',
                'assets/trading_cells/lang/es_es.json'
        ]
        def missing = required.findAll { !entries.contains(it) }
        def forbiddenFragments = [
                'com/cosmocraft/trading_cells/gametest/',
                'data/trading_cells/loot_tables/',
                'textures/item/quarry_upgrades/',
                'textures/item/piglin_barter_upgrades/',
                'textures/item/upgrades_quarry/',
                'textures/item/upgrades_piglin_netherite_trader/',
                'src/gameTest/',
                'tools/'
        ]
        def forbidden = entries.findAll { entry ->
            entry.endsWith('.bbmodel')
                    || forbiddenFragments.any { entry.contains(it) }
        }
        if (!missing.isEmpty() || !forbidden.isEmpty()) {
            def details = []
            if (!missing.isEmpty()) {
                details << "missing: ${missing.join(', ')}"
            }
            if (!forbidden.isEmpty()) {
                details << "forbidden: ${forbidden.join(', ')}"
            }
            throw new GradleException("Published JAR validation failed: ${details.join('; ')}")
        }
    }
}

def expectedPublishedJarName = "${project.mod_id}-${project.mod_version}.jar"
tasks.register('checkSinglePublishedArtifact') {
    group = 'verification'
    description = 'Rejects missing or additional JARs in the publication directory.'
    dependsOn publishedJar

    doLast {
        def jars = fileTree('build/libs').matching { include '*.jar' }.files
                .collect { it.name }
                .sort()
        if (jars != [expectedPublishedJarName]) {
            throw new GradleException(
                    "Expected only ${expectedPublishedJarName} in build/libs, found: ${jars.join(', ')}"
            )
        }
    }
}

