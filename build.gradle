plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
        content {
            includeGroup 'net.fabricmc'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Optional mods used only by selected development runs.
configurations {
    localRuntime
}

sourceSets {
    developmentClient {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations.developmentClientCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.developmentClientRuntimeClasspath.extendsFrom(
        configurations.runtimeClasspath,
        configurations.localRuntime
)

def prepareVulkanFmlConfig = tasks.register('prepareVulkanFmlConfig') {
    group = 'ide'
    description = 'Disables the NeoForge early OpenGL window for Vulkan development runs.'
    outputs.upToDateWhen { false }

    doLast {
        def configFile = layout.projectDirectory.file('run/vulkan/config/fml.toml').asFile
        configFile.parentFile.mkdirs()
        def setting = 'earlyWindowControl = false'
        def current = configFile.exists() ? configFile.getText('UTF-8') : ''
        def settingPattern = ~/(?m)^earlyWindowControl\s*=\s*(?:true|false)\s*$/
        def updated
        if (settingPattern.matcher(current).find()) {
            updated = current.replaceFirst(settingPattern, setting)
        } else if (current.isEmpty()) {
            updated = setting + System.lineSeparator()
        } else {
            def separator = current.endsWith('\n') ? '' : System.lineSeparator()
            updated = current + separator + setting + System.lineSeparator()
        }
        if (updated != current) {
            configFile.setText(updated, 'UTF-8')
        }
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            sourceSet = sourceSets.developmentClient
            // The dedicated client source set includes optional client mods
            // without exposing their classes to dedicated-server runs.
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // REI 26.2 still uses @OnlyIn. NeoForge reports every usage in the
            // development log, but this avoids an upstream warning blocking runClient.
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll(
                        '--quickPlaySingleplayer',
                        project.property('quickPlayWorld').toString()
                )
            }
        }

        clientVulkan {
            client()
            sourceSet = sourceSets.developmentClient
            gameDirectory = project.file('run/vulkan')
            // NeoForge 26.2.0.55-beta still creates its early window with an
            // OpenGL context, which cannot be handed to Minecraft's Vulkan backend.
            taskBefore prepareVulkanFmlConfig.get()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            programArguments.addAll '--graphicsBackend', 'VULKAN'
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll(
                        '--quickPlaySingleplayer',
                        project.property('quickPlayWorld').toString()
                )
            }
        }

        clientOpenGL {
            client()
            sourceSet = sourceSets.developmentClient
            gameDirectory = project.file('run/opengl')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
            systemProperty 'neoforge.warnings.logofile.hide', 'true'
            programArguments.addAll '--graphicsBackend', 'OPENGL'
            if (project.hasProperty('quickPlayWorld')) {
                programArguments.addAll(
                        '--quickPlaySingleplayer',
                        project.property('quickPlayWorld').toString()
                )
            }
        }

        server {
            server()
            // Keep dedicated-server runs isolated from client-only jars placed
            // in run/mods (notably REI and its client-side dependencies).
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        performanceServer {
            server()
            gameDirectory = project.file(
                    project.findProperty('performanceRunDirectory') ?: 'build/performance/server'
            )
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('performanceJfr')) {
                jvmArgument "-XX:StartFlightRecording=filename=${project.property('performanceJfr')},settings=profile,dumponexit=true"
            }
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // cosmocraft of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_api_version}"
    compileOnly("net.fabricmc:fabric-loader:0.19.3") {
        transitive = false
    }
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    if (!project.hasProperty('withoutRei')) {
        localRuntime "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
        localRuntime "dev.architectury:architectury-neoforge:${architectury_version}"
    }

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            rei_version_range      : rei_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs.add('-Xlint:unchecked')
}

tasks.register('checkArchitecture') {
    group = 'verification'
    description = 'Checks hexagonal dependency boundaries and production registry safety.'
    def sourceRoot = file('src/main/java')
    inputs.files(fileTree(sourceRoot) {
        include '**/*.java'
    })

    doLast {
        def violations = []
        def featurePrefix = 'com.cosmocraft.trading_cells.feature.'
        def sharedPrefix = 'com.cosmocraft.trading_cells.shared.'
        def sharedFeatures = ['captures'] as Set
        fileTree(sourceRoot).matching { include '**/*.java' }.each { source ->
            def relativePath = sourceRoot.toPath()
                    .relativize(source.toPath())
                    .toString()
                    .replace('\\', '/')
            def lines = source.readLines('UTF-8')
            def imports = []
            lines.eachWithIndex { line, index ->
                if (line.startsWith('import ')) {
                    imports << [text: line, line: index + 1]
                }
            }
            def expectedPackage = relativePath
                    .substring(0, relativePath.lastIndexOf('/'))
                    .replace('/', '.')
            def declaredPackage = lines.find { it.startsWith('package ') }
            if (declaredPackage != "package ${expectedPackage};") {
                violations << "${relativePath}: package does not match its directory"
            }
            def featureMatch = relativePath =~ /^com\/cosmocraft\/trading_cells\/feature\/([^\/]+)\//
            def ownerFeature = featureMatch.find() ? featureMatch.group(1) : null
            def sharedMatch = relativePath =~ /^com\/cosmocraft\/trading_cells\/shared\/([^\/]+)\//
            def ownerSharedModule = sharedMatch.find() ? sharedMatch.group(1) : null

            if (relativePath.contains('/domain/')) {
                def forbidden = [
                        'net.minecraft.',
                        'net.neoforged.',
                        'com.cosmocraft.trading_cells.platform.',
                        '.adapters.',
                        '.application.'
                ]
                imports.each { imported ->
                    if (forbidden.any { imported.text.contains(it) }) {
                        violations << "${relativePath}:${imported.line}: domain imports ${imported.text}"
                    }
                }
            }

            if (relativePath.contains('/application/')) {
                def forbidden = [
                        'net.minecraft.',
                        'net.neoforged.',
                        'com.cosmocraft.trading_cells.platform.',
                        '.adapters.'
                ]
                imports.each { imported ->
                    if (forbidden.any { imported.text.contains(it) }) {
                        violations << "${relativePath}:${imported.line}: application imports ${imported.text}"
                    }
                }
            }

            def sourceText = lines.join('\n')
            if (relativePath.contains('/adapters/')
                    && sourceText.contains('.application.service.')) {
                violations << "${relativePath}: adapter imports a concrete application service"
            }
            if (relativePath.contains('/adapters/')
                    && sourceText.contains('FeatureSettingsProvider')) {
                violations << "${relativePath}: adapter accesses configuration instead of an input port"
            }
            if (relativePath.contains('/application/service/')
                    && !(sourceText =~ /implements\s+\w+UseCase/).find()) {
                violations << "${relativePath}: application service does not implement an input port"
            }
            if (sourceText =~ /new\s+\w+Service\s*\(/) {
                if (relativePath != 'com/cosmocraft/trading_cells/platform/neoforge/bootstrap/FeatureComposition.java') {
                    violations << "${relativePath}: concrete services may only be created in FeatureComposition"
                }
            }

            if (ownerFeature != null) {
                imports.each { imported ->
                    if (imported.text.startsWith("import ${sharedPrefix}")
                            && !imported.text.contains('.shared.machines.domain.')) {
                        violations << "${relativePath}:${imported.line}: use a public shared-domain boundary"
                        return
                    }
                    if (!imported.text.startsWith("import ${featurePrefix}")) {
                        return
                    }
                    def target = imported.text
                            .substring(("import ${featurePrefix}").length())
                            .takeWhile { it != '.' }
                    if (target == ownerFeature) {
                        return
                    }
                    if (!sharedFeatures.contains(target)) {
                        violations << "${relativePath}:${imported.line}: feature ${ownerFeature} depends on ${target}"
                        return
                    }
                    if (target == 'captures'
                            && !imported.text.contains('.captures.domain.')
                            && !imported.text.contains('.captures.adapters.api.')) {
                        violations << "${relativePath}:${imported.line}: use the public Captures API"
                    }
                }
            }
            if (ownerSharedModule != null) {
                imports.each { imported ->
                    if (imported.text.startsWith("import ${featurePrefix}")) {
                        violations << "${relativePath}:${imported.line}: shared kernel depends on a feature"
                    }
                }
            }

            [
                    'RegisterGameTestsEvent',
                    'GameTestInstance',
                    'net.minecraft.gametest'
            ].each { forbiddenGameTestApi ->
                if (sourceText.contains(forbiddenGameTestApi)) {
                    violations << "${relativePath}: production source contains ${forbiddenGameTestApi}"
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Architecture violations:\n - " + violations.join('\n - ')
            )
        }
    }
}

tasks.register('checkGraphicsBackendIndependence') {
    group = 'verification'
    description = 'Rejects direct dependencies on OpenGL or Vulkan implementation classes.'
    def sourceRoot = file('src/main/java')
    def forbiddenReferences = [
            'org.lwjgl.opengl',
            'org.lwjgl.vulkan',
            'com.mojang.blaze3d.opengl',
            'com.mojang.blaze3d.vulkan',
            'GlStateManager',
            'GlDevice',
            'VulkanDevice'
    ]
    inputs.files(fileTree(sourceRoot) {
        include '**/*.java'
    })

    doLast {
        def violations = []
        fileTree(sourceRoot).matching { include '**/*.java' }.each { source ->
            def relativePath = sourceRoot.toPath()
                    .relativize(source.toPath())
                    .toString()
                    .replace('\\', '/')
            source.readLines('UTF-8').eachWithIndex { line, index ->
                forbiddenReferences.each { forbiddenReference ->
                    if (line.contains(forbiddenReference)) {
                        violations << "${relativePath}:${index + 1}: references ${forbiddenReference}"
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Graphics backend independence violations:\n - " + violations.join('\n - ')
            )
        }
    }
}

tasks.register('verifyDomainRules', JavaExec) {
    group = 'verification'
    description = 'Runs dependency-free checks for the pure feature rules.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.cosmocraft.trading_cells.architecture.DomainRulesVerification'
}

tasks.named('test', Test).configure {
    failOnNoDiscoveredTests = false
}

def pythonExecutable = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
        ? 'python'
        : 'python3'

tasks.register('checkMachineGuiTextures', Exec) {
    group = 'verification'
    description = 'Validates generated machine backgrounds and machine slot sprites.'
    commandLine pythonExecutable, 'tools/generate_machine_gui.py', '--check'
    inputs.file('tools/generate_machine_gui.py')
    inputs.dir('src/main/resources/assets/trading_cells/textures/gui/machines')
}

tasks.register('checkVillagerTradeGuiTextures', Exec) {
    group = 'verification'
    description = 'Validates villager trade backgrounds and widgets.'
    commandLine pythonExecutable, 'tools/generate_villager_trade_gui.py', '--check'
    inputs.file('tools/generate_villager_trade_gui.py')
    inputs.dir('src/main/resources/assets/trading_cells/textures/gui/trader')
    inputs.dir('src/main/resources/assets/trading_cells/textures/gui/sprites')
}

tasks.named('check').configure {
    dependsOn tasks.named('checkArchitecture')
    dependsOn tasks.named('checkGraphicsBackendIndependence')
    dependsOn tasks.named('verifyDomainRules')
    dependsOn tasks.named('checkMachineGuiTextures')
    dependsOn tasks.named('checkVillagerTradeGuiTextures')
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
